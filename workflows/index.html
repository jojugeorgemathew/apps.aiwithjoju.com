<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Online Whiteboard — Apps By Joju</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="logo">Apps By Joju</h1>
            <div class="controls">
                <input id="wf-search" class="search" type="search" placeholder="Search whiteboards..." aria-label="Search whiteboards">
                <button id="themeToggle" class="theme-toggle" title="Toggle theme">🌙</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="workflow-hero">
            <h2>Online Whiteboard</h2>
            <p class="tagline">Create, sketch, and organize your ideas visually. Fast and simple.</p>
        </section>

        <section>
            <div class="workflow-toolbar">
                <div style="display:flex;gap:12px;align-items:center;flex:1;min-width:200px">
                    <button id="addWf" class="btn-primary">+ Add New Whiteboard</button>
                    <span class="small-muted">Whiteboards are saved in your browser.</span>
                </div>
                <div style="min-width:220px">
                    <input id="sortSelect" aria-label="Sort whiteboards" class="search" style="width:100%" placeholder="Filter by title">
                </div>
            </div>

            <div id="workflowsGrid" class="workflows-grid" aria-live="polite">
                <!-- cards injected by script -->
            </div>

            <div id="empty" class="workflow-empty hidden">Click <strong>Add New Whiteboard</strong> to create a new canvas.</div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> AI With Joju</p>
        </div>
    </footer>

    <!-- Name Modal -->
    <div id="nameModal" class="modal hidden">
        <div class="modal-content">
            <h2>Create New Whiteboard</h2>
            <input id="workflowNameInput" type="text" placeholder="Enter whiteboard name..." autofocus>
            <div class="modal-buttons">
                <button id="cancelNameBtn" class="btn-secondary">Cancel</button>
                <button id="confirmNameBtn" class="btn-primary">Create & Open Canvas</button>
            </div>
        </div>
    </div>

    <!-- Canvas Editor Modal -->
    <div id="canvasModal" class="modal hidden full-screen">
        <div class="canvas-container">
            <!-- Canvas Title -->
            <div class="canvas-header">
                <h2 id="canvasTitle">Whiteboard Canvas</h2>
                <button id="saveCanvasBtn" class="btn-save" style="margin-left: auto;">Save & Close</button>
            </div>
            
            <!-- Canvas Area -->
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="drawingCanvas"></canvas>
            </div>

            <!-- Bottom Toolbar -->
            <div class="canvas-toolbar-bottom">
                <button id="undoBtn" class="tool-icon" title="Undo">↶</button>
                <button id="redoBtn" class="tool-icon" title="Redo">↷</button>
                <button id="clearBtn" class="tool-icon" title="Clear Canvas">🗑️</button>
                
                <div class="toolbar-divider"></div>
                
                <input id="colorPicker" type="color" value="#ffffff" title="Color" class="color-input" style="cursor:pointer;">
                <input id="brushSize" type="range" min="1" max="40" value="4" title="Brush Size" style="width: 80px; cursor:pointer;">
                
                <div class="toolbar-divider"></div>
                
                <button id="toolPen" class="tool-icon active" title="Pen">✏️</button>
                <button id="toolEraser" class="tool-icon" title="Eraser">🧻</button>
                <button id="toolFill" class="tool-icon" title="Fill Bucket">🪣</button>
                <button id="toolLine" class="tool-icon" title="Line">📏</button>
                <button id="toolRect" class="tool-icon" title="Rectangle">▢</button>
                <button id="toolCircle" class="tool-icon" title="Circle">◯</button>
                <button id="toolText" class="tool-icon" title="Text">T</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
