<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Expense Tracker — Apps By Joju</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="../ai.png">
</head>
<body>
	<header class="site-header">
		<div class="container header-inner">
			<a href="https://apps.aiwithjoju.com" class="logo" style="text-decoration:none;">&larr; Apps By Joju</a>
			<div class="controls">
				<button id="themeToggle" class="theme-toggle" title="Toggle theme">🌙</button>
			</div>
		</div>
	</header>

	<main class="container">
		<section class="hero">
			<h2>Expense Tracker</h2>
			<p class="tagline">Keep track of your spending effortlessly.</p>
		</section>

		<div class="tracker-layout">
			<!-- Add Expense Form -->
			<div class="card form-card">
				<h3>Add New Item</h3>
				<form id="expenseForm">
					<div class="input-group">
						<label for="expenseName">Item Name</label>
						<input type="text" id="expenseName" placeholder="e.g., Coffee, Groceries" required />
					</div>
					<div class="input-group">
						<label for="expensePrice">Price ($)</label>
						<input type="number" id="expensePrice" step="0.01" placeholder="0.00" required />
					</div>
					<div class="input-group">
						<label for="expenseNotes">Notes (Optional)</label>
						<textarea id="expenseNotes" placeholder="Add any extra details..."></textarea>
					</div>
					<button type="submit" class="btn-primary">+ Add Expense</button>
				</form>
			</div>

			<!-- Expense List & Summary -->
			<div class="card list-card">
				<div class="summary-header">
					<h3>Transactions</h3>
					<div class="total-badge">Total: <span id="totalAmount">$0.00</span></div>
				</div>
				<div id="expenseList" class="expense-list" aria-live="polite">
					<!-- Expenses injected here -->
				</div>
			</div>
		</div>
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>&copy; <span id="year"></span> AI With Joju</p>
		</div>
	</footer>

	<script src="script.js" defer></script>
</body>
</html>
