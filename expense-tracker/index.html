<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="https://apps.aiwithjoju.com" class="back-link">&larr; Apps By Joju</a>
        <button id="themeToggle" class="theme-btn">🌙</button>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="title-section">
            <h1>Expense Tracker</h1>
            <p>Keep track of your spending effortlessly.</p>
        </div>

        <div class="grid-layout">
            <!-- Form Section -->
            <div class="card">
                <h2>Add New Item</h2>
                <form id="expenseForm">
                    <div class="input-group">
                        <label for="itemName">Item Name</label>
                        <input type="text" id="itemName" placeholder="e.g., Coffee" required>
                    </div>
                    <div class="input-group">
                        <label for="itemPrice">Price ($)</label>
                        <input type="number" id="itemPrice" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="input-group">
                        <label for="itemNotes">Notes (Optional)</label>
                        <textarea id="itemNotes" placeholder="Add details..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">+ Add Expense</button>
                </form>
            </div>

            <!-- List Section -->
            <div class="card">
                <div class="list-header">
                    <h2>Transactions</h2>
                    <div class="total-badge">Total: $<span id="totalValue">0.00</span></div>
                </div>
                <div id="expenseList" class="expense-list">
                    <!-- Items go here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Script must match exactly -->
    <script src="script.js"></script>
</body>
</html>
